events {
  worker_connections 1024;
}

http {
  client_max_body_size 500M;

  # ---- HTTP -> HTTPS ----
  server {
    listen 80;
    server_name _;
    # DOMAIN MODE: replace the line above with
    # server_name nginx-nexus.example.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;
    # DOMAIN MODE: replace the line above with
    # server_name nginx-nexus.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Nexus UI
    location / {
      proxy_pass http://nexus:8081;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Docker proxy repo (DockerHub)  -> Nexus connector 8082
    location /v2 {
      proxy_pass http://nexus:8082;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
    }

    # Docker hosted repo (local images) -> Nexus connector 8083
    # (longer prefix, so it wins over /v2)
    location /v2/hosted {
      proxy_pass http://nexus:8083;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
}
